    openai:    { label: 'OpenAI',           models: ['gpt-4o','gpt-4o-mini','o1-mini'],                          default: 'gpt-4o-mini',      url: 'https://api.openai.com/v1/chat/completions' },
    google:    { label: 'Google Gemini',    models: ['gemini-1.5-pro','gemini-1.5-flash','gemini-2.0-flash-exp'], default: 'gemini-1.5-flash', url: 'https://generativelanguage.googleapis.com/v1beta/models/' },
  };

  // ─── State ───────────────────────────────────────────────────────
  const STATE = {
    config: loadConfig(),
    ai: { ready: false, loading: false, progress: 0, engine: null, model: null },
    mesh: { active: false, peers: new Map(), bc: null, signal: null },
  };

  function loadConfig() {
    try { return JSON.parse(localStorage.getItem('fall-kit.config') || '{}'); }
    catch (e) { return {}; }
  }
  function saveConfig() {
    try { localStorage.setItem('fall-kit.config', JSON.stringify(STATE.config)); } catch (e) {}
  }

  // ─── DOM helpers ─────────────────────────────────────────────────
  function $(s, root) { return (root || document).querySelector(s); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

  // ─── AI tier ─────────────────────────────────────────────────────
  function aiTier() { return STATE.config.ai_tier || 'T0'; }

  function renderAiChip() {
    const chip = $('#fk-ai-chip');
    if (!chip) return;
    const txt = $('#fk-ai-chip-text');
    chip.classList.remove('fk-chip-live', 'fk-chip-loading', 'fk-chip-warn');
    const tier = aiTier();
    if (tier === 'T0') { txt.textContent = 'T0 · off'; }
    else if (tier === 'T2') {
      if (STATE.ai.ready) { txt.textContent = 'T2 ' + (WEBLLM_MODELS[STATE.config.webllm_model || DEFAULT_MODEL]?.label.split(' · ')[0] || '') + ' · ready'; chip.classList.add('fk-chip-live'); }
      else if (STATE.ai.loading) { txt.textContent = 'T2 loading ' + Math.round(STATE.ai.progress) + '%'; chip.classList.add('fk-chip-loading'); }
      else { txt.textContent = 'T2 · click to load'; chip.classList.add('fk-chip-warn'); }
    } else if (tier === 'T3') {
      if (STATE.config.api_key) { txt.textContent = 'T3 ' + (T3_PROVIDERS[STATE.config.api_provider]?.label || 'BYOK') + ' · active'; chip.classList.add('fk-chip-live'); }
      else { txt.textContent = 'T3 · no key set'; chip.classList.add('fk-chip-warn'); }
    }
  }

  async function loadWebLLM(modelKey) {
    if (STATE.ai.loading) return;
    const key = modelKey || STATE.config.webllm_model || DEFAULT_MODEL;
    const model = WEBLLM_MODELS[key];
    if (!model) { console.error('fall-kit: unknown model', key); return; }
    if (STATE.ai.ready && STATE.ai.model === model.id) return;
    STATE.ai.loading = true; STATE.ai.progress = 0; renderAiChip();
    notify('Loading WebLLM · ' + model.label + ' · ' + model.size + ' first time', 'info');
    try {
      const { CreateMLCEngine } = await import('https://esm.run/@mlc-ai/web-llm@0.2.79');
      const engine = await CreateMLCEngine(model.id, {
        initProgressCallback: p => { STATE.ai.progress = (p.progress || 0) * 100; renderAiChip(); }
      });
      STATE.ai.engine = engine;
      STATE.ai.model = model.id;
      STATE.ai.ready = true;
      STATE.ai.loading = false;
      STATE.config.webllm_model = key; saveConfig();
      renderAiChip();
      notify('WebLLM ready · sovereign mode · ' + model.label.split(' · ')[0], 'ok');
    } catch (e) {
      console.error('fall-kit: WebLLM load failed', e);
      STATE.ai.loading = false; renderAiChip();
      notify('WebLLM load failed · ' + e.message, 'err');
    }
  }

  async function aiComplete(systemPrompt, userMsg, maxTokens) {
    maxTokens = maxTokens || 600;
    const tier = aiTier();
    if (tier === 'T2' && STATE.ai.ready && STATE.ai.engine) {
      const r = await STATE.ai.engine.chat.completions.create({
        messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: userMsg }],
        max_tokens: maxTokens,
      });
      return r.choices[0].message.content;
    }
    if (tier === 'T3' && STATE.config.api_key && STATE.config.api_provider) {
      return await aiCloudCall(systemPrompt, userMsg, maxTokens);
    }
    return null;
  }

  async function aiCloudCall(sys, msg, maxTokens) {
    const provider = STATE.config.api_provider;
    const key = STATE.config.api_key;
    const model = STATE.config.api_model || T3_PROVIDERS[provider]?.default;
    if (provider === 'anthropic') {
      const r = await fetch(T3_PROVIDERS.anthropic.url, {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01' },
        body: JSON.stringify({ model, max_tokens: maxTokens, system: sys, messages: [{ role: 'user', content: msg }] }),
      });
      if (!r.ok) throw new Error('Anthropic ' + r.status + ': ' + (await r.text()).slice(0, 200));
      const j = await r.json();
      return j.content[0].text;
    }
    if (provider === 'openai') {
      const r = await fetch(T3_PROVIDERS.openai.url, {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model, max_tokens: maxTokens, messages: [{ role: 'system', content: sys }, { role: 'user', content: msg }] }),
      });
      if (!r.ok) throw new Error('OpenAI ' + r.status);
      const j = await r.json();
      return j.choices[0].message.content;
    }
    if (provider === 'google') {
      const r = await fetch(T3_PROVIDERS.google.url + model + ':generateContent?key=' + encodeURIComponent(key), {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: sys + '\n\n---\n\n' + msg }] }], generationConfig: { maxOutputTokens: maxTokens } }),
      });
      if (!r.ok) throw new Error('Google ' + r.status);
      const j = await r.json();
      return j.candidates[0].content.parts[0].text;
    }
    throw new Error('unknown provider: ' + provider);
  }

  // ─── WebRTC P2P mesh (ported from canonical fallnet · fall-signal channel · Google STUN) ───
  const MESH_CHANNEL = 'fall-signal';
  const STUN_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }];
  function meshStart(opts) {
    if (STATE.mesh.active) return;
    opts = opts || {};
    const seedId = opts.seedId || (location.pathname + '#' + Math.random().toString(36).slice(2, 8));
    STATE.mesh.seedId = seedId;
    try { STATE.mesh.bc = new BroadcastChannel(MESH_CHANNEL); }
    catch (e) { console.warn('fall-kit: BroadcastChannel unavailable'); return; }
    STATE.mesh.bc.onmessage = e => {
      const m = e.data;
      if (!m || !m.kind || m.peerId === seedId) return;
      if (opts.onMessage) opts.onMessage(m);
    };
    STATE.mesh.bc.postMessage({ kind: 'fall-kit:hello', peerId: seedId, ts: Date.now(), seedName: opts.seedName || 'unknown' });
    STATE.mesh.active = true;
    notify('Mesh active · channel ' + MESH_CHANNEL, 'ok');
  }
  function meshPost(kind, payload) {
    if (!STATE.mesh.active || !STATE.mesh.bc) return false;
    STATE.mesh.bc.postMessage({ kind: kind, peerId: STATE.mesh.seedId, ts: Date.now(), payload: payload });
    return true;
  }

      t.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:#c08a3a;color:#0a0a0a;padding:9px 18px;border-radius:3px;font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:0;transition:all .22s;z-index:10000;pointer-events:none';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.background = kind === 'err' ? '#a14a2a' : kind === 'ok' ? '#6b8d4a' : '#c08a3a';
    t.style.color = kind === 'err' ? '#fff' : '#0a0a0a';
    t.style.opacity = '1';
    t.style.transform = 'translateX(-50%) translateY(0)';
    clearTimeout(t._to);
    t._to = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(20px)'; }, 2400);
  }

  function openMint() {
    const slug = (STATE.config.seedName || location.hostname.split('.')[0] || 'seed').replace(/[^a-z0-9-]/gi, '-').toLowerCase();
    const name = document.title.replace(/^[◊·\s]+/, '').split('·')[0].trim() || slug;
    const url = location.href.split('?')[0].split('#')[0];
    const desc = document.querySelector('meta[name="description"]')?.content?.slice(0, 200) || '';
    const params = new URLSearchParams({ fork: '1', parent_slug: slug, parent_name: name, parent_url: url, parent_desc: desc });

  }

  // ─── Public API ──────────────────────────────────────────────────
  root.FallKit = {

const $$=(s,p=document)=>Array.from(p.querySelectorAll(s));
const uid=(p='id')=>p+'_'+(crypto.randomUUID?crypto.randomUUID().replace(/-/g,'').slice(0,16):Math.random().toString(36).slice(2,18));

const ageYears=dob=>{if(!dob)return null;const d=new Date(dob),n=new Date();let a=n.getFullYear()-d.getFullYear();const m=n.getMonth()-d.getMonth();if(m<0||(m===0&&n.getDate()<d.getDate()))a--;return a};
const ageAnimal=dob=>{if(!dob)return'—';const y=ageYears(dob);if(y==null)return'—';if(y<1){const d=new Date(dob),n=new Date();const months=(n.getFullYear()-d.getFullYear())*12+(n.getMonth()-d.getMonth());return months+'mo'}return y+'y'};

async function sha256(s){const buf=s instanceof ArrayBuffer?s:new TextEncoder().encode(typeof s==='string'?s:JSON.stringify(s));const h=await crypto.subtle.digest('SHA-256',buf);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('')}

// ════════════════════════════════════════════════════════════════
// INDEXEDDB
// ════════════════════════════════════════════════════════════════
let db;
function openDB(){
 return new Promise((res,rej)=>{
 const r=indexedDB.open(STORE,1);
 r.onupgradeneeded=e=>{
 const d=e.target.result;
 if(!d.objectStoreNames.contains('state'))d.createObjectStore('state');
 if(!d.objectStoreNames.contains('audit'))d.createObjectStore('audit',{keyPath:'i'});
 if(!d.objectStoreNames.contains('chipverifs'))d.createObjectStore('chipverifs',{keyPath:'id'});
 };
 r.onsuccess=e=>{db=e.target.result;res(db)};
 r.onerror=e=>rej(e);
 });
}
function idbPut(store,val,key){return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');const r=key?tx.objectStore(store).put(val,key):tx.objectStore(store).put(val);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbGet(store,key){return new Promise((res,rej)=>{const tx=db.transaction(store,'readonly');const r=tx.objectStore(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbDel(store,key){return new Promise((res,rej)=>{const tx=db.transaction(store,'readwrite');const r=tx.objectStore(store).delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function idbAll(store){return new Promise((res,rej)=>{const tx=db.transaction(store,'readonly');const r=tx.objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}

async function persistState(){
 if(!db)await openDB();
 const snap={
 schemaVersion:state.schemaVersion,
 active:state.active,
 practice:state.practice,
 vets:state.vets,
 clients:state.clients,
 animals:state.animals,

 settings:state.settings,
 };
 try{localStorage.setItem(STORE+'.state',JSON.stringify(snap))}catch(e){}
 return idbPut('state',snap,'main');
}
async function loadState(){
 if(!db)await openDB();
 let s=await idbGet('state','main');
 if(!s){
 try{const raw=localStorage.getItem(STORE+'.state');if(raw)s=JSON.parse(raw)}catch(e){}
 }
 if(s){
 state.schemaVersion=s.schemaVersion||SCHEMA_V;
 state.active=s.active||'clients';
 state.practice=s.practice||null;

 state.animals=Array.isArray(s.animals)?s.animals:[];
 state.chat=Array.isArray(s.chat)?s.chat:[];
 state.settings=Object.assign({},state.settings,s.settings||{});
 }
 state.audit=await idbAll('audit');
 state.audit.sort((a,b)=>a.i-b.i);

// AUDIT CHAIN · P3 extended
// ════════════════════════════════════════════════════════════════
async function appendAudit(action, info){
 if(!state.settings.auditChain)return;
 if(!db)await openDB();
 const i=state.audit.length?state.audit[state.audit.length-1].i+1:1;
 const prevHash=state.audit.length?state.audit[state.audit.length-1].docHash:'';
 const payload=info.payload||{};
 const entry={
 i,ts:Date.now(),tool:TOOLNAME,
 vetId:info.vetId||'',clientId:info.clientId||'',animalId:info.animalId||'',
 action,reasoning:info.reasoning||'',
 configVersion:TOOLNAME+'@'+VERSION,
 prevHash,docHash:'',payload
 };
 entry.docHash=await sha256(JSON.stringify({prevHash,ts:entry.ts,action,clientId:entry.clientId,animalId:entry.animalId,payload}));
 state.audit.push(entry);
 if(state.audit.length>AUDIT_CAP){
 const drop=state.audit.length-AUDIT_CAP;
 for(let k=0;k<drop;k++){await idbDel('audit',state.audit[k].i)}
 state.audit=state.audit.slice(drop);
 }
 await idbPut('audit',entry);
}

// ════════════════════════════════════════════════════════════════
// BROADCAST MESH · fall-vet + fall-signal
// ════════════════════════════════════════════════════════════════
let bcVet=null,bcSignal=null;
let _bcDebounce={};
function bcInit(){
 try{
 bcVet=new BroadcastChannel('fall-vet');
 bcVet.addEventListener('message',handleVetMsg);
 bcSignal=new BroadcastChannel('fall-signal');
 bcSignal.addEventListener('message',handleSignalMsg);
 bcSignal.postMessage({source:TOOLNAME,type:'hello',prime:PRIME,version:VERSION,ts:now()});
 bcVet.postMessage({v:1,type:'sync.request',ts:now(),source:TOOLNAME,payload:{}});
 }catch(e){console.warn('BroadcastChannel unavailable',e)}
}
function bcSend(type,payload){
 if(!bcVet)return;
 const key=type+'|'+(payload?.id||'');
 clearTimeout(_bcDebounce[key]);
 _bcDebounce[key]=setTimeout(()=>{try{bcVet.postMessage({v:1,type,ts:now(),source:TOOLNAME,payload})}catch(e){}},300);
}
function bcSendNow(type,payload){if(!bcVet)return;try{bcVet.postMessage({v:1,type,ts:now(),source:TOOLNAME,payload})}catch(e){}}
async function handleVetMsg(e){
 const m=e.data;if(!m||m.source===TOOLNAME)return;
 switch(m.type){
 case 'sync.request':
 bcSendNow('sync.snapshot',{clients:state.clients,animals:state.animals,vets:state.vets,practice:state.practice});break;
 case 'sync.snapshot':mergeSnapshot(m.payload||{});render();break;
 case 'client.created':case 'client.updated':case 'client.archived':
 mergeRecord('clients',m.payload);render();break;
 case 'animal.created':case 'animal.updated':case 'animal.deceased':
 mergeRecord('animals',m.payload);render();break;
 case 'vet.created':case 'vet.updated':
 mergeRecord('vets',m.payload);render();break;
 case 'practice.updated':
 if(!state.practice||(m.payload?.updatedAt||0)>(state.practice?.updatedAt||0)){state.practice=m.payload;persistState();render()}break;
 }
}
function handleSignalMsg(e){
 const m=e.data;if(!m||m.source===TOOLNAME)return;
 if(m.type==='ping'&&bcSignal)bcSignal.postMessage({source:TOOLNAME,type:'pong',prime:PRIME,version:VERSION,ts:now()});
}
function mergeRecord(coll,rec){
 if(!rec||!rec.id)return;
 const arr=state[coll];const i=arr.findIndex(x=>x.id===rec.id);
 if(i<0){arr.push(rec);persistState();return}
 if((rec.updatedAt||0)>(arr[i].updatedAt||0)){arr[i]=rec;persistState()}
}
function mergeSnapshot(p){
 if(Array.isArray(p.clients))p.clients.forEach(c=>mergeRecord('clients',c));
 if(Array.isArray(p.animals))p.animals.forEach(a=>mergeRecord('animals',a));
 if(Array.isArray(p.vets))p.vets.forEach(v=>mergeRecord('vets',v));
 if(p.practice){if(!state.practice||(p.practice.updatedAt||0)>(state.practice.updatedAt||0)){state.practice=p.practice;persistState()}}
}

}

 const a=newAnimalRec();

 a.weightKg=12.4;

 a.microchipVerifiedAt=now()-86400000*7;a.microchipVerifiedBy=state.vets[0].id;
 a.insurer='petplan';a.insurancePolicyNo='PP-DEMO-001';a.insuranceExcess=99;a.insuranceCoveragePct=80;

 // a demo chip verification entry
 await recordChipVerification(a.id,a.microchipNo,a.microchipDb,'verified',state.vets[0].id,'Demo seed verification');

async function purgeDemoIfPresent(){
 const demos=state.clients.filter(c=>c.app?.isDemo);
 if(demos.length===0)return false;
 const real=state.clients.filter(c=>!c.app?.isDemo&&!c.archivedAt);
 if(real.length===0)return false;
 const demoIds=new Set(demos.map(c=>c.id));
 state.clients=state.clients.filter(c=>!c.app?.isDemo);
 state.animals=state.animals.filter(a=>!demoIds.has(a.clientId)&&!a.app?.isDemo);
 if(state.practice?.name?.startsWith('DEMO &middot; ')||state.practice?.name?.startsWith('DEMO · '))state.practice=null;
 state.vets=state.vets.filter(v=>!(v.name||'').startsWith('DEMO'));
 await persistState();
 await appendAudit('demo.purged',{reasoning:'First real owner added — demo records cleared'});
 return true;
}

const T0_RULES=[
 {match:/gdpr.*pet|pet.*gdpr|data.*consent|owner data|gdpr consent/i,title:'GDPR consent for pet & owner data',answer:()=>`**UK GDPR + Data Protection Act 2018** — pet data itself is not personal data, but **owner identifiers** are (name, address, contact, payment info). Veterinary clinical records bundle the two.

**Lawful basis options:**
- **Contract performance** (Art.6(1)(b)) — providing veterinary care under the engagement. This covers most clinical use of owner data — you don't strictly need separate "consent" to keep clinical records for treatment.
- **Legal obligation** (Art.6(1)(c)) — RCVS-required records, controlled-drug register, notifiable disease reports.
- **Legitimate interests** (Art.6(1)(f)) — internal quality assurance, billing, debt recovery.
- **Consent** (Art.6(1)(a)) — required separately for *marketing* (PECR) and for sharing with non-essential third parties (e.g. insurance back-claims after the fact, referral specialists outside the immediate clinical chain).

**Practical checklist on registration:**
1. Privacy notice handed/emailed at sign-up (no consent ticks for clinical processing — contractual)
2. Marketing opt-in: separate, granular, opt-IN (not pre-ticked)
3. Insurance direct-claim consent: explicit, recorded with ts
4. Referral-clinic data sharing: covered under treatment unless out-of-network/private specialist
5. Retain: 5 years post-last-treatment (RCVS), or 7 years if pursuing fees

**Subject access:** owners can request all data held on them + their animals. 1 calendar month to respond.`},
 {match:/microchip.*cat|cat.*microchip|cats mandatory|cat chip law/i,title:'Microchipping cats — mandatory date',answer:()=>`**Microchipping of Cats Regulations 2024** — mandatory in **England** from **10 June 2024**.

- Applies to **cats over 20 weeks old** kept as pets
- Owner must have cat chipped and registered to a compliant database before 20 weeks
- £500 fixed-penalty for non-compliance (21 days to comply after notice)
- **Exemptions:** vet certifies chipping would compromise health (rare); free-living cats (feral colony cats not "kept")

**Scotland, Wales, Northern Ireland:** voluntary at time of writing (2026-06). Check current devolved status before advising.

**Practice workflow:**
- At every cat consult, confirm chip + database registration status
- If unchipped + over 20 weeks: implant, register to a compliant database (Petlog, Identibase, etc.), advise owner of legal duty
- Record chip number on \`Animal.microchipNo\` and database on \`Animal.microchipDb\`
- The database — not the chip itself — carries the owner contact data; remind owners to update on change of address/owner`},
 {match:/microchip.*dog|dog.*microchip|dogs mandatory|dog chip law/i,title:'Microchipping dogs — mandatory date',answer:()=>`**Microchipping of Dogs (England) Regulations 2015** — mandatory from **6 April 2016**.

- All dogs over **8 weeks** must be microchipped and registered to a compliant database
- Welsh equivalent regs 2015; Scotland 2016; Northern Ireland already had similar (2012)
- £500 fixed-penalty notice for non-compliance (21 days)
- Breeders must chip puppies before sale and register to themselves; on sale, transfer to new owner

**Compliant databases (UK):** Petlog, MicrochipID, Identibase, Animaltrac, Pet-Scanner, Protected Pet, National Vet Data Service, Pet ID, SmartTrac.

**Always verify** at first registration — a chip number alone is not enough; it must correspond to a record on a compliant database with current owner contact details. Scan, check number matches owner's claim, then verify against the database (web lookup or call). Record outcome in \`chipverifs\` log.

**On change of owner:** new keeper has 21 days to update. Vet's role is to remind, not to update on the owner's behalf (you don't own the data).`},
 {match:/insurance.*excess|excess.*co-?pay|co-?pay.*insurance|pet insurance excess/i,title:'Pet insurance excess vs co-pay',answer:()=>`**Excess** = the fixed amount the owner pays per claim/condition before insurance contributes.
- "£99 excess per condition per policy year" — the most common UK structure
- "£250 excess per claim" — less common, can stack badly on multi-condition treatment

**Co-payment** = the *percentage* the owner pays of the remaining bill after the excess.
- Often introduced when the pet reaches 8-10 years old (Petplan: 20% co-pay from age 8)
- A claim for £1,000 with £99 excess + 20% co-pay: insurer pays (1000-99) * 0.8 = £720.80, owner pays £279.20

**Capture both** at registration:
- \`insuranceExcess\` (£)
- \`insuranceCoveragePct\` (the % insurer covers, e.g. 80 means 20% co-pay)

**Pre-authorisation:** for surgeries above ~£500 most insurers want pre-auth (24-48hrs typical). Always confirm before scheduling a planned procedure. Emergency treatment proceeds without pre-auth.

**Direct claim eligibility:** depends on insurer + practice agreement. Petplan, ManyPets, Agria, Animal Friends most commonly direct-claim. Direct Line, Tesco usually require owner to pay then claim back.`},
 {match:/rcvs.*consent|informed consent|consent.*treatment|consent guidance/i,title:'RCVS informed consent guidance',answer:()=>`**RCVS Code of Professional Conduct §2.4** — informed consent is required before treatment.

**Three elements (Bolam-equivalent for vets):**
1. **Disclosure** of the proposed procedure, its purpose, common risks, reasonable alternatives (including no treatment)
2. **Comprehension** — owner must understand; if not, defer or seek a competent decision-maker
3. **Voluntariness** — no coercion; financial pressure (insurance limits, cost) must not unduly steer

**General consent at registration** — covers routine examinations, vaccinations, sample collection (blood/urine), basic treatment.

**Specific consent required for:**
- General anaesthetic procedures (each separate procedure)
- Off-licence (cascade) prescribing where the medicine is unauthorised for the species
- Euthanasia (always specific, ideally in writing or witnessed)
- Procedures with uncommon but significant risks
- Photography for teaching/marketing (NOT for the clinical record)

**Capacity:**
- Owner must be 16+ in most cases; under-18 routinely refer to parent/guardian for major decisions
- For business-owned animals (riding school, farm) verify signatory authority
- Where owners disagree (divorce, joint ownership) — do not proceed without unanimity for non-emergency

**Record everything** — consents with ts, what was discussed, alternatives offered, owner's decision. \`Animal.consents\` field captures the standing consents; per-procedure consent goes in the consult notes.`},
 {match:/animal welfare act|awa 2006|duty of care.*animal|five welfare needs/i,title:'Animal Welfare Act 2006 — duties',answer:()=>`**Animal Welfare Act 2006** (England & Wales) — the primary animal-welfare statute. Equivalent: Animal Health and Welfare (Scotland) Act 2006; Welfare of Animals Act (NI) 2011.

**Five welfare needs** (§9) — owner's duty:
1. **Environment** — suitable place to live
2. **Diet** — suitable food + water
3. **Behaviour** — ability to exhibit normal behaviour patterns
4. **Companionship** — housed with, or apart from, other animals appropriately
5. **Protection from pain, injury, suffering, disease**

**Vet's role:**
- **Unnecessary suffering** (§4) — an offence; vet may be needed to certify suffering for prosecution
- **Reporting suspected abuse/neglect** — RCVS guidance: report to RSPCA / local authority / police. Owner-confidentiality is overridden where animal welfare is at risk
- **Mutilations** (§5) — most unlawful; exceptions include castration, ear-tagging for ID, surgical procedures by a vet on medical grounds
- **Tail docking** — prohibited except certified working-dog exemption (specific breeds, before 5 days old, owner declaration)

**Maximum penalty:** 5 years prison + unlimited fine (raised from 6 months in 2021 — Animal Welfare (Sentencing) Act 2021).

**Disqualification orders** can ban offenders from keeping animals for life.`},
 {match:/notifiable|report.*disease|notifiable disease|reporting duty/i,title:'Notifiable diseases — vet duty to report',answer:()=>`**Animal Health Act 1981** + various species-specific orders. Suspicion of a notifiable disease must be reported to **APHA** (Animal & Plant Health Agency) immediately.

**Most-likely-encountered notifiables in small-animal practice:**
- **Rabies** (any mammal) — 0300 200 7840 (England), 03000 200 301 (Wales), 03000 999 999 (Scotland)
- **Brucellosis** (canine: B. canis — increasingly seen in imported rescue dogs from Eastern Europe; reportable in dogs as of 2021)
- **Echinococcus multilocularis** (tapeworm — imported dog risk)
- **Bovine TB** (in pets contracting from livestock contact — rare but reportable)
- **Avian influenza** (in any kept bird)

**Farm/equine practice adds:** Foot-and-mouth, BSE, Bluetongue, African swine fever, Equine infectious anaemia, Glanders, etc.

**Procedure on suspicion:**
1. Isolate the animal and any contacts on-site
2. Do not move samples off-site without APHA authority
3. Phone APHA Duty Officer immediately — do not email
4. Restrict the premises pending APHA decision
5. Document: clinical signs, suspected diagnosis, owner contacts, animal movements last 30 days

**Confidentiality:** owner confidentiality is overridden by the statutory reporting duty. Inform the owner contemporaneously.`},
 {match:/insurance.*pre-?auth|pre-?auth.*insurance|pre-?approval.*treatment/i,title:'Insurance pre-authorisation — typical workflow',answer:()=>`**Pre-authorisation** (a.k.a. pre-approval) — insurer confirms in writing that a planned, non-emergency procedure is likely covered before it is performed.

**When required (typical thresholds):**
- Petplan: £500+ planned procedure
- ManyPets: £750+ or any new chronic condition
- Direct Line: £500+
- Agria: complex referrals always

**What insurer wants:**
- Animal policy number + owner details
- Diagnosis (or working diagnosis) + supporting evidence (bloods, imaging)
- Proposed procedure(s) + indicative cost breakdown
- Alternatives considered + why chosen approach
- Whether direct-claim or owner-pays-and-claims

**Turnaround:** 24-72 hours typical. Emergency overnight requests usually possible by phone.

**FallVetOnboard data captured at registration enables this:**
- \`insurer\` + \`insurancePolicyNo\` + \`insuranceExcess\` + \`insuranceCoveragePct\` + \`insuranceConditionExclusions\` — all needed at pre-auth time
- \`previousPractice\` — so insurer can request prior records to rule out pre-existing condition exclusion

**Pre-existing condition trap:** insurer will look back; if condition was noted at *any* prior practice and not declared at policy inception, claim may be refused. At onboarding, ask explicitly about every prior episode, even if appearing unrelated.`},
 {match:/wholesale.*retail|retail.*wholesale|pet medicine.*supply|vet medicines.*supply|wholesale.*pet/i,title:'Wholesale vs retail pet medicines',answer:()=>`**Veterinary Medicines Regulations 2013** (VMR) governs supply.

**Wholesale (B2B):** holder of a Wholesale Dealer's Authorisation (WDA) supplies to vets / SQPs / pharmacies. Practices must hold appropriate WDA-equivalent if they on-sell to other practices. **Cannot** wholesale to the public.

**Retail (B2C — to owner):** vet practice retails to its own clients under the SQP/POM-V framework:
- **POM-V** — Prescription Only, Veterinary — only a vet may prescribe (after clinical assessment), only a vet/pharmacist may supply
- **POM-VPS** — Prescription Only, Vet/Pharmacist/SQP — farm livestock + horse meds typically; suitably qualified person can prescribe
- **NFA-VPS** — Non-Food Animal, Vet/Pharmacist/SQP — most flea/worm products
- **AVM-GSL** — Authorised Vet Medicine, General Sales List — over-the-counter (e.g. some basic wound dressings)

**Record-keeping (VMR Sch.3):**
- Date of transaction, name & address of recipient, identifier of animal, name+batch+quantity of product, name of prescriber
- Retained **5 years**
- Required for all POM-V and POM-VPS supplies

**Internet sales:** allowed if the practice holds an Accredited Internet Retailer (AIR) status; the prescribing vet must still have a real clinical relationship with the animal (no over-the-internet POM-V without clinical assessment).

**Cost transparency (Competition & Markets Authority 2024 review):** the CMA is examining vet medicine pricing. Best practice now is to give written price quote on request + offer to write a script for owner to source elsewhere.`},
 {match:/cascade|prescrib|off-?label|off-?licence|unauthorised use/i,title:'Cascade prescribing principles',answer:()=>`**VMR 2013 Sch.4 — The Cascade.** Where no authorised UK veterinary medicine exists for the condition/species, a vet may, in descending order of preference, prescribe:

**1.** A veterinary medicine authorised in the UK for **another condition or species**
**2.** A medicine authorised for human use in the UK
**3.** A medicine authorised in another country for animal use (special-import certificate from VMD)
**4.** An extemporaneously prepared medicine (compounded by a pharmacist/manufacturer to the vet's specification)

**Strict preconditions:**
- A vet has the animal under their care
- No authorised UK product would adequately treat the condition (animal-suffering trigger)
- Used by the vet personally, or under direct responsibility

**Specific consent required** — owner must be told the product is being used off-licence, the reasoning, and any known risks. Record this in the consult notes.

**Food-producing animal special rules:**
- Active substance must appear in Commission Regulation (EU) 37/2010 (MRLs)
- **Withdrawal period** (\`withdrawalPeriod\`) must be set by the vet — cannot be zero; minimum statutory:
 - Eggs/milk: 7 days
 - Meat (poultry/mammals): 28 days
 - Fish meat: 500 degree-days
- Capture in \`Consult.prescriptions[].withdrawalPeriod\`

**Record-keeping:** vet must keep cascade records for **5 years**, including the reasoning. FallVetPaper handles the per-prescription docs.`},
 {match:/out.?of.?hours|ooh|emergency cover|24.?7|night cover/i,title:'Out-of-hours cover — RCVS obligation',answer:()=>`**RCVS Code of Professional Conduct §3.5** — vets must provide 24/7 emergency cover, **either themselves or by formal arrangement**.

**Acceptable arrangements:**
1. **In-house OOH** — own vets on rota
2. **Dedicated OOH provider** — e.g. Vets Now, MediVet OOH (the dominant UK options)
3. **Reciprocal arrangement** with another practice (less common, must be formal)

**Client must be told:**
- Who provides OOH and how to contact them
- Whether the OOH provider is on-site at the home practice or off-site (clients may need to travel)
- That additional charges apply at OOH rates
- That direct-claim may NOT apply at the OOH provider — owner may need to pay and claim back

**Capture on registration:** owner should acknowledge they have received OOH info. (FallVetOnboard’s GDPR consent step is the natural place to record this.)

**Continuity of care:** OOH provider should be able to access the animal's recent records. Practice Standards Scheme (PSS) requires a documented information-flow between day and OOH provider.

**OOH staff competence:** the on-call vet must be competent (and a registered vet) for the species presented. If an OOH provider cannot handle a presented case (e.g. exotic), it must refer onward (charity / specialist) — not refuse care.`},
 {match:/complaint|complaint handling|practice complaint|client complaint/i,title:'Practice complaint handling',answer:()=>`**RCVS Code §6** + Veterinary Client Mediation Service (VCMS).

**Internal complaints procedure** — every practice must have one, written, given to clients on request (and ideally publicised on website / waiting room). Minimum elements:

1. **Acknowledgment** — within 5 working days of complaint received
2. **Investigation** — by someone not directly involved where possible (lead vet / practice manager)
3. **Written response** — within 28 days, addressing each point, with reasoning
4. **Internal review** — if client not satisfied, partner / clinical director second look
5. **External signposting** — must tell complainant about VCMS

**Free external mediation: VCMS** — https://www.vetmediation.co.uk/ — funded by RCVS, independent, free to public + practice. Aim: resolution within 90 days, before any RCVS concerns review.

**RCVS Concerns Investigation** (formal regulatory complaint) — invoked for serious-misconduct issues (drug abuse, criminal conviction, gross clinical failure). Most consumer complaints go to VCMS first.

**Capture at onboarding:**
- Privacy notice should reference complaints procedure
- Hand the leaflet / point to web URL during sign-up
- Audit chain entry on every complaint received — the RCVS will ask if they investigate

**Statute of limitations on negligence claim:** 6 years from the date of negligence (Limitations Act 1980 §2) — or 3 years from date of knowledge for latent injury. Keep records accordingly (5yr clinical RCVS + a buffer = 7yr safe default).`},
];

async function answer(q){
 for(const r of T0_RULES){if(r.match.test(q))return{src:'T0 · '+r.title,text:r.answer()}}
 const tier=Cascade.detectTier();
 if(tier==='T3'){
 const sys='You are FallVetOnboard, a sovereign UK veterinary-practice onboarding tool. You help an RCVS-regulated, PSS-accredited independent vet practice with owner GDPR, animal registration, microchip compliance (Microchipping of Dogs Regs 2015 / Cats Regs 2024), pet insurance pre-auth, consent to treatment (RCVS Code 2.4), Animal Welfare Act 2006 duties, cascade prescribing (VMR 2013 Sch.4), notifiable disease reporting (APHA), out-of-hours cover (Code 3.5), and VCMS complaint handling. **You are informational — not a substitute for the practice’s MRCVS lead vet’s professional judgment.** Cite source (RCVS Code section, VMR regulation, Act + section). Be concrete and UK-specific. End with: "Verify with your lead vet / RCVS practice standards inspector before relying."';
 const ctx='Practice: '+(state.practice?.name||'(not set up)')+'. Active owners: '+(state.clients.filter(c=>!c.archivedAt).length)+'. Animals: '+(state.animals.filter(a=>!a.deceasedAt).length)+'. Vets: '+state.vets.length+'.';
 const r=await Cascade.generate(sys,ctx+'\n\nQuestion: '+q,1400);
 if(r.text)return{src:r.tier,text:r.text}
 }
 return{src:'T0 · fallback',text:'I don’t have a canned rule for that question. Add an API key in **Settings** (Gemini is free) to enable T3 grounded answers.\n\nSupported T0 topics:\n'+T0_RULES.map(r=>'• '+r.title).join('\n')};
}

// ════════════════════════════════════════════════════════════════
// VIEW · ROUTER
// ════════════════════════════════════════════════════════════════
function render(){
 $('#brandName').textContent=state.settings.engineName||'FallVetOnboard';
 const nav=$('#nav');
 const clientCount=state.clients.filter(c=>!c.archivedAt).length;
 const animalCount=state.animals.filter(a=>!a.deceasedAt).length;
 nav.innerHTML=TABS.map(t=>{
 let count='';
 if(t.id==='clients')count=clientCount;
 else if(t.id==='animals')count=animalCount;
 else if(t.id==='vets')count=state.vets.filter(v=>!v.archivedAt).length;
 else if(t.id==='chiplog')count=state.chipVerifications.length;
 const cnt=count!==''?'<span class="tcount">'+count+'</span>':'';
 return '<button class="'+(state.active===t.id?'active':'')+'" onclick="go(\''+t.id+'\')">'+t.label+cnt+'</button>'
 }).join('');
 updateTierBadge();
 const v=$('#view');
 if(state.ui.wizard){v.innerHTML=renderWizardShell();bindWizard();return}
 if(state.ui.activeClient){v.innerHTML=renderClientDetail();bindClientDetail();return}
 if(state.ui.activeAnimal){v.innerHTML=renderAnimalDetail();bindAnimalDetail();return}
 switch(state.active){
 case 'clients':v.innerHTML=renderClients();bindClients();break;
 case 'animals':v.innerHTML=renderAnimals();bindAnimals();break;
 case 'dashboard':v.innerHTML=renderDashboard();break;
 case 'practice':v.innerHTML=renderPractice();bindPractice();break;
 case 'vets':v.innerHTML=renderVets();bindVets();break;
 case 'chiplog':v.innerHTML=renderChipLog();break;
 case 'qa':v.innerHTML=renderQA();bindQA();break;
 default:v.innerHTML=renderClients();bindClients();
 }
 // setup nudge
 if(!state.practice?.setupCompletedAt && !state.settings.setupDismissed && state.active!=='practice'){
 const b=document.createElement('div');
 b.className='banner warn';
 b.innerHTML='<strong>Practice setup incomplete.</strong> Add your RCVS practice registration, PSS level, PII cover and lead vet before going live. <button class="btn sm" style="margin-left:8px" onclick="go(\'practice\')">Setup now</button> <button class="btn sm ghost" style="margin-left:4px" onclick="dismissSetup()">Later</button>';
 v.insertBefore(b,v.firstChild);
 }
}
function go(t){
 state.active=t;state.ui.activeClient=null;state.ui.activeAnimal=null;state.ui.wizard=null;
 persistState();render();
}

function renderAnimalsTable(list){
 return '<table><thead><tr><th>Animal</th><th>Species</th><th>Breed</th><th>Owner</th><th>Age</th><th>Last visit</th><th>Vaccines</th><th>Chronic</th></tr></thead><tbody>'+
 list.map(a=>{
 const owner=state.clients.find(c=>c.id===a.clientId);
 const vacStatus=vaccinationsDue(a)?'<span class="tag amber">due</span>':((a.vaccinationHistory||[]).length?'<span class="tag green">up to date</span>':'<span class="tag muted">none recorded</span>');
 const chr=(a.chronicConditions||[]).length?'<span class="tag ox">'+a.chronicConditions.length+'</span>':'<span style="color:var(--cream-muted)">—</span>';
 const demo=a.app?.isDemo?'<span class="tag muted">demo</span> ':'';
 return '<tr class="row-link" onclick="openAnimal(\''+a.id+'\')"><td><span class="an-av">'+speciesEmoji(a.species)+'</span><strong>'+esc(a.name)+'</strong> '+demo+'</td>'+
 '<td>'+esc(speciesLabel(a.species))+'</td>'+
 '<td>'+esc(a.breed||'—')+'</td>'+
 '<td>'+(owner?'<a href="#" onclick="event.stopPropagation();openClient(\''+owner.id+'\');return false">'+esc(owner.firstName+' '+owner.lastName)+'</a>':'<span style="color:var(--cream-muted)">—</span>')+'</td>'+
 '<td>'+ageAnimal(a.dob)+'</td>'+
 '<td>'+fmtDate(a.lastVisitAt)+'</td>'+
 '<td>'+vacStatus+'</td>'+
 '<td>'+chr+'</td></tr>';
 }).join('')+
 '</tbody></table>'
}
function vaccinationsDue(a){
 // simple heuristic: no vaccination history = unknown but flag for review; history exists but all expired = due
 const h=a.vaccinationHistory||[];
 if(h.length===0)return false; // unknown != due in this MVP (avoid false alarms)
 return h.every(v=>v.expiresAt&&v.expiresAt<now());
}

 state.chat.map(m=>'<div class="msg '+m.role+'">'+esc(m.text)+(m.src?'<div class="src">'+esc(m.src)+'</div>':'')+'</div>').join(''))+
 '</div>'+
 '<div class="chat-input"><input id="qa_in" placeholder="Ask… e.g. “Microchipping cats mandatory date?”" onkeydown="if(event.key===\'Enter\')sendQA()"><button class="btn primary" onclick="sendQA()">ask</button></div>'+
 '<div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:5px">'+T0_RULES.map(r=>'<button class="chip" onclick="quickQA(\''+esc(r.title).replace(/'/g,'')+'\')">'+esc(r.title)+'</button>').join('')+'</div>'+
 '</div>'
}
function bindQA(){const el=$('#qa_in');if(el)el.focus()}
async function sendQA(){
 const i=$('#qa_in');const q=i.value.trim();if(!q)return;
 state.chat.push({role:'user',text:q});i.value='';render();
 const r=await answer(q);
 state.chat.push({role:'bot',text:r.text,src:r.src});await persistState();render();
 const c=$('#chat');if(c)c.scrollTop=c.scrollHeight;
}
function quickQA(t){$('#qa_in').value=t;sendQA()}

const WIZARD_STEPS=[

function newClient(){
 state.ui.wizard={step:1,client:newClientRec(),animal:newAnimalRec()};
 state.ui.activeClient=null;state.ui.activeAnimal=null;
 render();
}

function renderWizardShell(){
 const w=state.ui.wizard;
 const stepsHtml=WIZARD_STEPS.map(s=>{
 const cls=s.id===w.step?'active':(s.id<w.step?'done':'');
 return '<div class="wstep '+cls+'" onclick="gotoStep('+s.id+')"><span class="n">'+s.id+'</span>'+esc(s.l)+'</div>';
 }).join('');
 return '<div class="wizard">'+
 '<div class="section-h"><div><h2>Register owner + animal</h2><div class="sub">step '+w.step+' of 10</div></div>'+
 '<div class="actions"><button class="btn ghost" onclick="cancelWizard()">cancel</button></div></div>'+

 '<div class="wizard-foot">'+

function gotoStep(n){
 // commit current step values before jumping
 captureStep(state.ui.wizard.step);
 state.ui.wizard.step=n;render();
}
function prevStep(){captureStep(state.ui.wizard.step);if(state.ui.wizard.step>1){state.ui.wizard.step--;render()}}
function nextStep(){captureStep(state.ui.wizard.step);if(state.ui.wizard.step<10){state.ui.wizard.step++;render()}}
function cancelWizard(){if(confirm('Cancel registration? Captured details will be discarded.')){state.ui.wizard=null;render()}}

function captureStep(n){
 const w=state.ui.wizard;
 if(!w)return;
 const c=w.client,a=w.animal;
 const g=id=>{const e=document.getElementById(id);return e?e.value:''};
 const gc=id=>{const e=document.getElementById(id);return e?e.checked:false};
 switch(n){
 case 1:
 c.title=g('w_title')||c.title;c.firstName=g('w_firstName');c.lastName=g('w_lastName');
 c.preferredName=g('w_preferredName');c.dob=g('w_dob');
 c.email=g('w_email');c.phone=g('w_phone');c.phoneAlt=g('w_phoneAlt');
 const pv=g('w_primaryVetId');if(pv!==undefined&&pv!=='')c.primaryVetId=pv;
 else if(pv===''&&!c.primaryVetId&&state.vets.length)c.primaryVetId=state.vets[0].id;
 break;
 case 2:
 c.address.line1=g('w_l1');c.address.line2=g('w_l2');c.address.city=g('w_city');
 c.address.region=g('w_region')||c.address.region;c.address.postcode=g('w_postcode');
 break;
 case 3:
 c.accountStatus=g('w_accountStatus')||c.accountStatus;
 c.paymentTerms=g('w_paymentTerms')||c.paymentTerms;
 break;
 case 4:
 a.name=g('w_an_name');a.species=g('w_an_species')||a.species;a.breed=g('w_an_breed');
 a.colour=g('w_an_colour');a.dob=g('w_an_dob');a.sex=g('w_an_sex')||a.sex;
 a.neutered=gc('w_an_neutered');
 const w_kg=g('w_an_weight');a.weightKg=w_kg?parseFloat(w_kg):null;
 break;
 case 5:
 a.microchipNo=g('w_an_chipNo').trim();a.microchipDb=g('w_an_chipDb');
 break;
 case 6:
 a.insurer=g('w_an_insurer');a.insurancePolicyNo=g('w_an_policyNo');
 if(a.insurer&&a.insurer!=='none'){
 a.insuranceExcess=parseFloat(g('w_an_excess'))||0;
 a.insuranceCoveragePct=parseFloat(g('w_an_cov'))||0;
 a.insuranceCoverStart=g('w_an_covStart');
 a.insuranceConditionExclusions=g('w_an_excl');
 }
 // owner-level insurer mirror
 if(a.insurer)c.petInsuranceProvider=a.insurer;
 break;
 case 7:
 a.previousPractice=g('w_an_prevPractice');a.previousPracticeContact=g('w_an_prevContact');
 const parseList=s=>s.split(',').map(x=>x.trim()).filter(Boolean);
 a.allergies=parseList(g('w_an_allergies'));
 a.chronicConditions=parseList(g('w_an_chronic'));
 a.regularMedications=parseList(g('w_an_meds'));
 a.medicalHistoryNotes=g('w_an_history');
 break;
 case 8:
 a.consents.generalTreatment=gc('w_c_general');
 if(a.consents.generalTreatment&&!a.consents.generalTreatmentSignedAt)a.consents.generalTreatmentSignedAt=now();
 a.consents.anaestheticConsent=gc('w_c_anaes');
 a.consents.bloodSamples=gc('w_c_bloods');
 a.consents.photographyForRecords=gc('w_c_photo');
 a.consents.euthanasiaDecisionMaker=g('w_c_eot');
 a.consents.lateralThinking=g('w_c_notes');
 break;
 case 9:
 c.gdprConsentToContact=gc('w_g_contact');
 c.marketingOptIn=gc('w_g_marketing');
 c.consentSharedWithInsurer=gc('w_g_insurer');
 c.consentSharedWithReferrals=gc('w_g_referrals');
 break;
 }
}

async function confirmChip(result){
 const w=state.ui.wizard;if(!w)return;
 captureStep(5);
 const a=w.animal;
 if(!a.microchipNo){toast('Enter chip number first');return}
 // need a clientId after first save; for the in-progress wizard we record with placeholder animalId (animal will get its real id on commit)
 // we log immediately so the verification log is honest even if user cancels
 await recordChipVerification(a.id,a.microchipNo,a.microchipDb||'other',result,w.client.primaryVetId||(state.vets[0]?.id||''),'Logged during wizard registration');
 if(result==='verified'){a.microchipVerifiedAt=now();a.microchipVerifiedBy=w.client.primaryVetId||(state.vets[0]?.id||'')}
 toast('Chip '+result+' logged');render();
}
function markChipUnverified(){const w=state.ui.wizard;if(w){w.animal.microchipVerifiedAt=null;render()}}

async function commitWizard(){
 captureStep(state.ui.wizard.step);

function importData(){
 const inp=document.createElement('input');inp.type='file';inp.accept='.json';
 inp.onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 const text=await f.text();
 try{
 const d=JSON.parse(text);
 if(d.tool!==TOOLNAME){if(!confirm('File is from '+d.tool+', not '+TOOLNAME+'. Import anyway?'))return}
 if(d.practice)state.practice=d.practice;
 if(Array.isArray(d.vets))d.vets.forEach(v=>mergeRecord('vets',v));
 if(Array.isArray(d.clients))d.clients.forEach(c=>mergeRecord('clients',c));
 if(Array.isArray(d.animals))d.animals.forEach(a=>mergeRecord('animals',a));
 await persistState();
 toast('Imported');closeModal();render();
 }catch(err){toast('Import failed: '+err.message)}
 };
 inp.click();
}

}

function gate14(){
 const checks={
 singleHtmlFile:true, // 1
 idbPrimary:!!indexedDB, // 2
 localStorageFallback:true, // 3
 broadcastMesh:!!window.BroadcastChannel, // 4
 pwaManifest:!!document.querySelector('link[rel=manifest]'), // 5
 t0Offline:T0_RULES.length>=10, // 6
 t3Byok:true, // 7
 auditChain:state.settings.auditChain, // 8
 mobileFirst:true, // 9
 disclaimerPresent:document.body.textContent.includes('FallVetOnboard'), // 10
 sovereignAesthetic:true, // 11
 forkableBrand:true, // 12
 twoAudienceReadme:true, // 13
 primeAssigned:PRIME===953, // 14
 };
 const pass=Object.values(checks).filter(Boolean).length;
 console.log('[FallVetOnboard] 14-pt gate: '+pass+'/14',checks);
 return pass;
}
